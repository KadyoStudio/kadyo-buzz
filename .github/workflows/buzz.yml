name: Buzz alert

on:
  schedule:
    - cron: "3-59/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: buzz
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: buzz-state-${{ github.run_id }}
          restore-keys: buzz-state-
      - name: Check sources
        run: node buzz.mjs
        env:
          ACTU_BOT_TOKEN: ${{ secrets.ACTU_BOT_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Publication calendar
        if: always()
        run: node publisher.mjs
        env:
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: buzz-state-${{ github.run_id }}
